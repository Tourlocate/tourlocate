# Härtung der Apache-Auslieferung im Tourlocate-Container.
#
# Wird per Dockerfile nach /etc/apache2/conf-enabled/ kopiert und gilt
# damit serverweit — UNABHÄNGIG von AllowOverride/.htaccess (das
# php:*-apache-Basisimage setzt standardmäßig "AllowOverride None",
# wodurch die zur Laufzeit erzeugte .htaccess im Datenverzeichnis sonst
# wirkungslos bliebe).

# 1) Rückfallschutz: Das Datenverzeichnis liegt eigentlich außerhalb des
#    Web-Roots (/var/lib/tourlocate, siehe docker/entrypoint.sh), ist also
#    über HTTP gar nicht erreichbar. Diese Regel bleibt als Gürtel-und-
#    Hosenträger, falls jemand das Volume versehentlich wieder nach
#    app/data hängt. Schadet nicht, wenn das Verzeichnis nicht existiert.
<Directory /var/www/html/app/data>
    Require all denied
</Directory>

# 2) Verzeichnislisting serverweit abschalten (kein Durchblättern von
#    Ordnern, falls mal eine index-Datei fehlt).
<Directory /var/www/html>
    Options -Indexes
</Directory>

# 3) Produktiv-Startseite: Das nackte „/" (und „/index.html" ohne Query) ist
#    im Betrieb der Login, nicht der freie Planer. Darum nur diese beiden auf
#    /app/ umleiten. WICHTIG: NICHT umleiten, wenn „?app" gesetzt ist — die
#    angemeldete App öffnet die freie Karte als „../index.html?app=1" (siehe
#    app/dashboard.php), und die statische Planer-App bleibt als Datei für die
#    GitHub-Pages-Demo erhalten. 302 (nicht 301), damit sich die Umleitung
#    ohne hartnäckiges Browser-Caching wieder ändern ließe.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{QUERY_STRING} !(^|&)app(=|&|$)
    RewriteRule ^/?(index\.html)?$ /app/ [R=302,L]
</IfModule>
