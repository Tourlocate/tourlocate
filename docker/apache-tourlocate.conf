# Härtung der Apache-Auslieferung im Tourlocate-Container.
#
# Wird per Dockerfile nach /etc/apache2/conf-enabled/ kopiert und gilt
# damit serverweit — UNABHÄNGIG von AllowOverride/.htaccess (das
# php:*-apache-Basisimage setzt standardmäßig "AllowOverride None",
# wodurch die zur Laufzeit erzeugte .htaccess im Datenverzeichnis sonst
# wirkungslos bliebe).

# 1) Rückfallschutz: Das Datenverzeichnis liegt eigentlich außerhalb des
#    Web-Roots (/var/lib/tourlocate, siehe docker/entrypoint.sh), ist also
#    über HTTP gar nicht erreichbar. Diese Regel bleibt als Gürtel-und-
#    Hosenträger, falls jemand das Volume versehentlich wieder nach
#    app/data hängt. Schadet nicht, wenn das Verzeichnis nicht existiert.
<Directory /var/www/html/app/data>
    Require all denied
</Directory>

# 2) Verzeichnislisting serverweit abschalten (kein Durchblättern von
#    Ordnern, falls mal eine index-Datei fehlt) — UND die Produktiv-Umleitung
#    der Startseite.
#
#    WICHTIG — warum die Umleitung HIER im <Directory> steht und nicht als
#    freistehender RewriteRule-Block: mod_rewrite-Regeln werden NICHT in den
#    <VirtualHost> des Basisimages (000-default.conf) vererbt. Ein globaler
#    RewriteRule in conf-enabled läuft deshalb für die eigentlichen Requests
#    GAR NICHT — genau das war der Grund, warum „/" trotz gemergter Konfig
#    weiter die Demo statt des Logins zeigte. <Directory>-Abschnitte dagegen
#    greifen unabhängig vom VirtualHost (sie werden über den Dateipfad
#    zugeordnet und immer zusammengeführt).
#
#    Produktiv-Startseite: Das nackte „/" (und „/index.html" ohne Query) ist
#    im Betrieb der Login, nicht der freie Planer. Darum nur diese beiden auf
#    /app/ umleiten. NICHT umleiten, wenn „?app" gesetzt ist — die angemeldete
#    App öffnet die freie Karte als „../index.html?app=1" (siehe
#    app/dashboard.php), und die statische Planer-App bleibt als Datei für die
#    GitHub-Pages-Demo erhalten. 302 (nicht 301), damit sich die Umleitung
#    ohne hartnäckiges Browser-Caching wieder ändern ließe.
#
#    Das Muster ist OHNE führenden Slash, weil mod_rewrite im <Directory>-
#    Kontext den Verzeichnis-Präfix abschneidet: „/" → "" , „/index.html" →
#    "index.html". „/app/…" → "app/…" trifft das Muster nicht → keine Schleife.
<Directory /var/www/html>
    Options -Indexes

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{QUERY_STRING} !(^|&)app(=|&|$)
        RewriteRule ^(index\.html)?$ /app/ [R=302,L]
    </IfModule>
</Directory>

# 4) Gleichzeitige Apache-Worker begrenzen. Das Basisimage nutzt mpm_prefork
#    mit Default MaxRequestWorkers 150 — 150 × PHP-memory_limit (256M) könnten
#    weit über das Container-mem_limit (siehe docker-compose.yml) hinausgehen
#    und den Container in den OOM treiben. Requests sind kurz (meist Lesen aus
#    SQLite), daher liefern wenige Worker schon hohen Durchsatz. ServerLimit
#    muss ≥ MaxRequestWorkers sein.
<IfModule mpm_prefork_module>
    ServerLimit 25
    MaxRequestWorkers 25
</IfModule>
