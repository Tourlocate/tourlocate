name: Docker-Image bauen & veröffentlichen

# Baut das Container-Image und pusht es nach GHCR (ghcr.io):
#   - Push auf main  → Tags :latest UND :main-<kurz-sha>  (laufender Stand)
#   - Git-Tag v*     → Tag :vX.Y.Z  (unveränderlich → zum Pinnen/Zurückrollen)
#   - manuell (Actions-UI, "Run workflow") → wie der auslösende Branch
#
# Damit kann Portainer das FERTIGE Image ziehen (image: …) statt es auf dem
# Server zu bauen — schneller und ohne Build-Last/Speicherhunger auf dem Host.
#
# EINMALIGE Vorbereitung: Nach dem ersten erfolgreichen Lauf das GHCR-Paket auf
# "public" stellen (GitHub → Repo → rechte Spalte "Packages" → tourlocate →
# "Package settings" → "Change visibility" → Public), sonst braucht Portainer
# Registry-Zugangsdaten zum Ziehen.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tourlocate/tourlocate
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bauen & pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
